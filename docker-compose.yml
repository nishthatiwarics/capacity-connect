version: '3.8'

services:
  capacity-connect:
    build:
      context: .
      dockerfile: Dockerfile
    image: capacity-connect-portal:latest
    container_name: capacity-connect-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
